[project]
name = "pachoos-backend"
version = "1.0.0"
description = "PACHOOS bakery & fruits shop backend"
requires-python = ">=3.12"

# ---------------------------------------------------------------------------
# Ruff - fast Python linting & formatting (PEP8-first, minimal diff config)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]
exclude = ["*/migrations/*", "*/static/*", "staticfiles/*", "*/db.sqlite3*", ".venv", "*.pyc"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N"]
ignore = ["N802", "N803", "N806", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------------
# Pytest + pytest-django
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["test_*.py", "tests.py"]
addopts = "-ra --strict-markers"